schema_version: "1.1"
name: category-url-discipline
expected_outcome: |
  Reaches the trousers listing through the store's own navigation and filter controls
  rather than by typing a guessed category path. Confirms the page it landed on by its
  heading, breadcrumb or result count before reading the grid, and confirms the filters
  applied before treating the results as a candidate set. If Aritzia has no mid-rise
  option in tailored trousers, says so plainly instead of quietly dropping the constraint.
